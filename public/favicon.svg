<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Creator DNA app icon</title>
  <desc id="desc">A luminous DNA story graph on a deep obsidian rounded square.</desc>
  <defs>
    <radialGradient id="surface" cx="42%" cy="32%" r="82%">
      <stop offset="0" stop-color="#182D4D"/>
      <stop offset="0.52" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155EEF"/>
      <stop offset="0.52" stop-color="#36D6C5"/>
      <stop offset="1" stop-color="#E8F31A"/>
    </linearGradient>
    <linearGradient id="strandBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155EEF"/>
      <stop offset="1" stop-color="#4385FF"/>
    </linearGradient>
    <linearGradient id="strandAqua" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36D6C5"/>
      <stop offset="1" stop-color="#19BBAA"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="32" y="32" width="960" height="960" rx="224"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#surface)"/>
    <circle cx="282" cy="228" r="330" fill="#155EEF" opacity=".13" filter="url(#softGlow)"/>
    <circle cx="802" cy="782" r="310" fill="#36D6C5" opacity=".11" filter="url(#softGlow)"/>
    <path d="M72 742L336 1006M688 22L980 314" stroke="#36D6C5" stroke-width="2" opacity=".12"/>
    <path d="M20 376L376 20M648 1004L1004 648" stroke="#155EEF" stroke-width="2" opacity=".13"/>
  </g>
  <rect x="44" y="44" width="936" height="936" rx="212" fill="none" stroke="url(#edge)" stroke-width="9" opacity=".9"/>
  <circle cx="512" cy="512" r="326" fill="#08101D" stroke="#1E304F" stroke-width="10"/>
  <circle cx="512" cy="512" r="304" fill="none" stroke="url(#edge)" stroke-width="8" opacity=".75"/>
  <g filter="url(#softGlow)">
    <path d="M350 304C446 304 482 434 674 434C800 434 800 590 674 590C482 590 446 720 350 720" fill="none" stroke="url(#strandBlue)" stroke-linecap="round" stroke-width="38"/>
    <path d="M674 304C578 304 542 434 350 434C224 434 224 590 350 590C542 590 578 720 674 720" fill="none" stroke="url(#strandAqua)" stroke-linecap="round" stroke-width="38"/>
  </g>
  <circle cx="674" cy="304" r="52" fill="#E8F31A" filter="url(#nodeGlow)"/>
  <circle cx="350" cy="304" r="44" fill="#FFD83D"/>
  <circle cx="512" cy="434" r="38" fill="#31D158"/>
  <circle cx="674" cy="590" r="45" fill="#155EEF"/>
  <circle cx="350" cy="590" r="52" fill="#36D6C5" filter="url(#nodeGlow)"/>
  <circle cx="512" cy="720" r="45" fill="#E8F31A"/>
  <g fill="#FFFFFF" opacity=".36">
    <circle cx="658" cy="286" r="12"/><circle cx="336" cy="289" r="10"/>
    <circle cx="499" cy="421" r="8"/><circle cx="658" cy="574" r="10"/>
    <circle cx="332" cy="572" r="12"/><circle cx="496" cy="704" r="10"/>
  </g>
</svg>
